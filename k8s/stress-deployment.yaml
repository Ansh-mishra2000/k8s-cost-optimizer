apiVersion: apps/v1
kind: Deployment

metadata:
  name: stress-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: stress

  template:
    metadata:
      labels:
        app: stress

    spec:
      containers:

      - name: stress

        image: polinux/stress

        command:
          - "stress"

        args:
          - "--cpu"
          - "1"

          - "--timeout"
          - "3600s"

        resources:

          requests:
            cpu: "1000m"
            memory: "128Mi"

          limits:
            cpu: "2000m"
            memory: "512Mi"