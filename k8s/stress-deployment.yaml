apiVersion: apps/v1
kind: Deployment

metadata:
  name: stress-app
  namespace: default

spec:
  replicas: 1

  selector:
    matchLabels:
      app: stress

  template:
    metadata:
      labels:
        app: stress

    spec:
      containers:
      - name: stress
        image: polinux/stress
        command:
        - "stress"
        args:
        - "--cpu"
        - "1"
        - "--timeout"
        - "3600s"

        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "128Mi"