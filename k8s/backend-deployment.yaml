apiVersion: apps/v1
kind: Deployment

metadata:
  name: k8s-cost-optimizer
  namespace: optimizer

spec:
  replicas: 1

  selector:
    matchLabels:
      app: k8s-cost-optimizer

  template:
    metadata:
      labels:
        app: k8s-cost-optimizer

    spec:
      serviceAccountName: k8s-cost-optimizer-sa

      containers:
      - name: backend
        image: 464716974838.dkr.ecr.ap-south-1.amazonaws.com/k8s-cost-optimizer-k8s-cost-optimizer-dev:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 9000

        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: DATABASE_URL

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "400m"
            memory: "384Mi"

        livenessProbe:
          httpGet:
            path: /
            port: 9000
          initialDelaySeconds: 15
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 5