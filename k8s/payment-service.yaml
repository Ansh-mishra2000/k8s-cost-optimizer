apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service

spec:
  replicas: 3

  selector:
    matchLabels:
      app: payment-service

  template:

    metadata:
      labels:
        app: payment-service

    spec:

      containers:

      - name: payment

        image: polinux/stress

        command:
        - "stress"

        args:
        - "--cpu"
        - "1"

        resources:

          requests:

            cpu: "500m"

            memory: "256Mi"

          limits:

            cpu: "1"

            memory: "512Mi"