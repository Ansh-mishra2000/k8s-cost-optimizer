apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: default

spec:
  replicas: 1

  selector:
    matchLabels:
      app: payment-service

  template:
    metadata:
      labels:
        app: payment-service

    spec:
      containers:
      - name: payment
        image: polinux/stress
        command:
        - "stress"
        args:
        - "--cpu"
        - "1"

        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"